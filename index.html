<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Rania ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Book container */
.book {
    width: 200px;
    height: 260px;
    position: relative;
    perspective: 1000px;
    cursor: pointer;
}

/* Cover */
.cover {
    width: 100%;
    height: 100%;
    background: #ff4d6d;
    position: absolute;
    border-radius: 10px;
    transform-origin: left;
    transition: transform 1s;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
}

/* Open animation */
.book.open .cover {
    transform: rotateY(-160deg);
}

/* Inside page */
.page {
    width: 100%;
    height: 100%;
    background: white;
    border-radius: 10px;
    position: absolute;
    padding: 20px;
    box-sizing: border-box;
    color: #333;
    opacity: 0;
    transition: opacity 1s ease 0.8s;
}

.book.open .page {
    opacity: 1;
}

.signature {
    margin-top: 20px;
    font-style: italic;
    text-align: right;
    color: #ff4d6d;
    font-weight: bold;
}

/* Floating hearts */
.heart {
    position: absolute;
    color: rgba(255,255,255,0.8);
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="book" onclick="openBook()">
    <div class="cover">Tap to Open 💌</div>
    <div class="page">
        <h2>Rania ❤️</h2>
        <p>
            I’m really sorry for my behavior…  
            You told me you were busy, and I should have understood.  
            I miss you, and I just want to make things right again.  
        </p>
        <p>
            Please forgive me… you mean so much to me. 💔
        </p>

        <div class="signature">
            — From Danish ❤️
        </div>
    </div>
</div>

<!-- Hidden music -->
<iframe id="music"
    width="0" height="0"
    src=""
    frameborder="0"
    allow="autoplay">
</iframe>

<script>
function openBook() {
    document.querySelector(".book").classList.add("open");

    // Play music (Daylight)
    document.getElementById("music").src =
    "https://www.youtube.com/embed/u9raS7-NisU?autoplay=1";

    createHearts();
}

/* Floating hearts */
function createHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerText = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (10 + Math.random() * 20) + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }, 300);
}
</script>

</body>
</html>
